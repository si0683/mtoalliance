name: Deploy to GitHub Pages

on:
  # Собирать и публиковать при пуше в master
  push:
    branches: [master]
  # ...и по кнопке «Run workflow» на вкладке Actions
  workflow_dispatch:

# Права, нужные для публикации на GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Одновременно — только один деплой; лишние запуски в очереди не отменяем
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build with Astro
        uses: withastro/action@v3
        with:
          node-version: 22
          # path: .            # корень проекта (по умолчанию)
          # package-manager: npm

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
